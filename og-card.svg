<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7ede0"/>
      <stop offset="40%" stop-color="#eee0cb"/>
      <stop offset="100%" stop-color="#d9bf94"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e85d2e"/>
      <stop offset="100%" stop-color="#f59a36"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Accent stripe -->
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <!-- Decorative circles (stage dots) -->
  <circle cx="920" cy="180" r="80" fill="#e85d2e" opacity="0.08"/>
  <circle cx="1020" cy="320" r="120" fill="#7b3d9a" opacity="0.06"/>
  <circle cx="850" cy="420" r="60" fill="#f59a36" opacity="0.08"/>
  <circle cx="1100" cy="150" r="40" fill="#6f8fb8" opacity="0.07"/>
  <circle cx="980" cy="500" r="50" fill="#2d7a55" opacity="0.06"/>

  <!-- Logo wordmark -->
  <text x="80" y="220" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="400" fill="#1a120d" letter-spacing="-1">
    Plursky
  </text>

  <!-- Tagline -->
  <text x="84" y="275" font-family="'Courier New', monospace" font-size="16" fill="#1a120d" opacity="0.55" letter-spacing="4">
    FESTIVAL COMPANION
  </text>

  <!-- Divider -->
  <rect x="80" y="300" width="60" height="3" rx="1.5" fill="#e85d2e"/>

  <!-- Description -->
  <text x="80" y="350" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#1a120d" opacity="0.75">
    Lineup builder, live map, crew meetups, walking ETAs,
  </text>
  <text x="80" y="382" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#1a120d" opacity="0.75">
    and artist discovery — built for the festival.
  </text>

  <!-- Stage pills -->
  <g transform="translate(80, 430)">
    <rect width="90" height="30" rx="15" fill="#e85d2e" opacity="0.12" stroke="#e85d2e" stroke-opacity="0.3" stroke-width="1"/>
    <text x="45" y="20" font-family="'Courier New', monospace" font-size="10" fill="#1a120d" text-anchor="middle" letter-spacing="1.5">LINEUP</text>

    <rect x="100" width="70" height="30" rx="15" fill="#7b3d9a" opacity="0.12" stroke="#7b3d9a" stroke-opacity="0.3" stroke-width="1"/>
    <text x="135" y="20" font-family="'Courier New', monospace" font-size="10" fill="#1a120d" text-anchor="middle" letter-spacing="1.5">MAP</text>

    <rect x="180" width="80" height="30" rx="15" fill="#f59a36" opacity="0.12" stroke="#f59a36" stroke-opacity="0.3" stroke-width="1"/>
    <text x="220" y="20" font-family="'Courier New', monospace" font-size="10" fill="#1a120d" text-anchor="middle" letter-spacing="1.5">CREW</text>

    <rect x="270" width="100" height="30" rx="15" fill="#2d7a55" opacity="0.12" stroke="#2d7a55" stroke-opacity="0.3" stroke-width="1"/>
    <text x="320" y="20" font-family="'Courier New', monospace" font-size="10" fill="#1a120d" text-anchor="middle" letter-spacing="1.5">OFFLINE</text>
  </g>

  <!-- URL -->
  <text x="80" y="560" font-family="'Courier New', monospace" font-size="14" fill="#1a120d" opacity="0.4" letter-spacing="2">
    PLURSKY.COM
  </text>

  <!-- Bottom accent stripe -->
  <rect x="0" y="624" width="1200" height="6" fill="url(#accent)"/>
</svg>
