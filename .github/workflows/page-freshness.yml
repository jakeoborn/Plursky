# The TIME-driven half of the generated-page freshness gate.
#
# verify.mjs runs `gen-festival-pages.mjs --check` on every pull request, and
# that catches CHANGE-driven rot: someone edits the registry or a lineup and
# does not regenerate. It deliberately tolerates the calendar, because a
# festival ending is nobody's commit and must not fail an unrelated PR.
#
# Which leaves the rot path that has no commit at all. A festival ends; its
# page should start saying so; nothing in the repo changed, so no PR runs and
# nothing notices. /f/arc-2026/ sat past its own end date exactly this way.
# That path needs a clock, not a diff — so this job carries it, with the
# strict check that does include the calendar.
#
# It opens a PULL REQUEST and never pushes to main. The rot is real and the
# fix is mechanical, but the output is real content on a public site, so it
# lands in the normal review flow like any other change. Founder direction,
# 2026-09-09.
name: page freshness

on:
  schedule:
    # 06:15 UTC daily. Not on the hour: GitHub queues scheduled workflows and
    # the top of the hour is the most contended slot, which is where skipped
    # runs come from.
    - cron: '15 6 * * *'
  # So it can be proved on demand instead of waiting a day to find out whether
  # it works — and so a flip can be re-checked immediately after merging.
  workflow_dispatch:

# contents: write is for the SIDE BRANCH below and nothing else. main is
# protected and this workflow must never target it.
permissions:
  contents: write
  pull-requests: write

jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Node 22 for the same reason sanity.yml pins it — @babel/core@8's
      # engines range. This script only needs node:fs and node:vm, but the
      # two workflows agreeing on a runtime is worth more than the saving.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # --check-strict, NOT --check. The tolerant mode is the pull-request
      # contract; this job exists precisely to catch what that one forgives.
      # continue-on-error so a stale page opens a PR instead of just going red.
      - name: Generated pages current, calendar included
        id: freshness
        continue-on-error: true
        run: node scripts/gen-festival-pages.mjs --check-strict

      - name: Regenerate and open a PR
        if: steps.freshness.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: chore/page-freshness
        run: |
          set -euo pipefail
          node scripts/gen-festival-pages.mjs

          if git diff --quiet; then
            echo "::error::--check-strict failed but regenerating changed nothing."
            echo "That means the two disagree — a bug in the script, not stale pages."
            exit 1
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # One long-lived branch, force-pushed. A daily job that opened a new
          # PR per run would bury the repo in duplicates of the same diff.
          git checkout -B "$BRANCH"
          git add -A
          git commit -m "chore(seo): regenerate /f/ pages — a festival's dates have passed

          Opened by the page-freshness workflow. gen-festival-pages.mjs
          --check-strict found a generated page that no longer matches the
          calendar: a festival has ended and its page should say so. No source
          change triggered this, which is why a scheduled job owns it.

          Review the diff as normal — it is machine-generated but it is public
          copy."
          git push --force origin "$BRANCH"

          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "chore(seo): regenerate /f/ pages — a festival's dates have passed" \
              --body "$(cat <<'BODY'
          Opened automatically by **page freshness** (`.github/workflows/page-freshness.yml`).

          `gen-festival-pages.mjs --check-strict` found a generated page that no longer
          matches the calendar — a festival has ended and its page should start saying so.
          No source change triggered this, which is exactly why a scheduled job owns it and
          the pull-request gate does not.

          The diff is machine-generated by re-running the generator, but it is **public copy
          on a crawlable page**, so it wants the same read as any other change.

          ⚠️ Checks will not run on this PR by themselves: GitHub does not trigger workflows
          for pull requests opened with `GITHUB_TOKEN`. Push an empty commit, or close and
          reopen, if you want `sanity` on it before merging.
          BODY
          )"
          else
            echo "PR already open for $BRANCH — force-pushed the refreshed diff onto it."
          fi
