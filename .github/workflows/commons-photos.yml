name: commons-photos

# Runs scripts/find-commons-photos.mjs where Wikimedia is reachable and
# commits what it found (WebP portraits, ledger rows, the run report) back to
# the branch that asked. A run is requested by editing
# data/artist-photos/commons-run.json on a photos/** branch, or by hand.
# It never touches main: the rows land on a branch and reach the app only
# through a reviewed pull request.
on:
  push:
    branches: ['photos/**']
    paths: ['data/artist-photos/commons-run.json']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: commons-photos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: WebP encoder
        run: sudo apt-get update -qq && sudo apt-get install -y -qq webp
      - name: Find openly licensed portraits
        run: |
          ARGS=$(jq -r '.args | join(" ")' data/artist-photos/commons-run.json)
          node scripts/find-commons-photos.mjs $ARGS --report docs/qa/reports/artist-photos-commons/last-run.json
      - name: Ledger still validates
        run: node scripts/build-artist-photo-ledger.mjs
      - name: Commit results to this branch
        run: |
          git config user.name "commons-photos[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artist-photos data/artist-photos data/artist-photos.js docs/qa/reports/artist-photos-commons
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "data(photos): Commons pipeline run ($(jq -r '.args | join(" ")' data/artist-photos/commons-run.json))"
          git push
