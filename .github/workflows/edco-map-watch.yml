name: edco-map-watch

# Every Monday until the EDC Orlando 2026 flip (Nov 6-8): has Insomniac
# published the official map? A RED run means a map candidate appeared (or the
# pages could not be read). Rebuild from it with scripts/build-edco-map-2026.mjs
# before the flip. Delete this workflow after the flip.
on:
  schedule:
    - cron: "0 14 * * 1"   # Mondays 14:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Look for the official EDC Orlando 2026 map
        run: node scripts/watch-edco-map.mjs
