name: sanity

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # `npm ci` is back, and it is the point of this step rather than a
      # formality. The lockfile used to be peer-inconsistent as committed:
      # @revenuecat/purchases-capacitor@13.1.2 declares peer
      # @capacitor/core >=8.0.0 while the app is pinned to Capacitor 6, so
      # `npm ci` exited ERESOLVE and no native build could be produced at
      # all. RevenueCat is now pinned to an EXACT 9.2.2 — the last release
      # whose peer range is ^6.0.0 (10.0.0 moved to >=7.0.0, 12.x/13.x to
      # >=8.0.0), so the tree resolves without --legacy-peer-deps.
      #
      # Keep the pin EXACT (no caret). A caret would let npm walk forward
      # into 10.x and silently reintroduce the ERESOLVE this step exists to
      # catch. Moving to RC 13 requires the Capacitor 8 upgrade, which is a
      # separate scheduled project.
      - name: Install (npm ci — guards the Capacitor 6 peer range)
        run: npm ci

      - name: Build (scripts/build.mjs copy step)
        run: node scripts/build.mjs

      # Cheapest gate first: three files, one regex, fails in milliseconds.
      # The v230 -> v231 -> v232 cascade happened because three PRs each
      # hand-sed'd the version and nothing checked they agreed.
      - name: Cache-bust drift check (index.html + sw.js + app.jsx)
        run: node scripts/bump.mjs --check

      # Syntax only — no typecheck. Pinned to the repo's devDependency so
      # CI and local agree on what "parses" means.
      - name: JSX parse gate (syntax only, no typecheck)
        run: npx --yes --package=typescript@6.0.3 tsc --noEmit --allowJs --checkJs false --jsx preserve --skipLibCheck $(git ls-files '*.jsx' ':!ios/**')

      # The real gate. AGENTS.md §2 rule 2 has always required a Babel
      # react-preset transform AND a headless mount probe per change; both were
      # manual, which means skippable, and it let the local check and CI drift.
      # scripts/verify.mjs is that check as code, run by both.
      - name: Chrome present (mount probe needs it)
        run: google-chrome --version

      - name: Verify gate (babel react-preset + headless mount probe)
        run: node scripts/verify.mjs
