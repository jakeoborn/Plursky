<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  .no-scrollbar::-webkit-scrollbar{display:none}
  .no-scrollbar{-ms-overflow-style:none;scrollbar-width:none}
  html,body{width:100%;min-height:100%;background:#f7ede0;font-family:'Geist',system-ui,sans-serif;color:#1a120d;overflow-x:hidden}
  body{display:flex;align-items:stretch;justify-content:stretch;padding:0;min-height:100vh}

  /* --- Plursky inside-screen palette --- */
  :root{
    --ink:#1a120d;
    --paper:#f7ede0;
    --paper-2:#eee0cb;
    --dune:#d9bf94;
    --ember:#e85d2e;
    --flare:#f59a36;
    --horizon:#7b3d9a;
    --night:#1a1030;
    --dusk:#2a1a3d;
    --sky:#6f8fb8;
    --line:rgba(26,18,13,0.12);
    --line-2:rgba(26,18,13,0.22);
    --muted:rgba(26,18,13,0.68);
    --success:#2d7a55;
    /* ── Type scale (4-tier) ── */
    --fs-label-s:8px; --fs-label:9px; --fs-label-l:10px;
    --fs-body-s:13px; --fs-body:14px; --fs-body-l:16px;
    --fs-title-s:18px; --fs-title:20px; --fs-title-l:24px;
    --fs-display-s:28px; --fs-display:34px; --fs-display-l:42px; --fs-display-xl:52px;
    /* ── Spacing (4px grid) ── */
    --sp-4:4px; --sp-8:8px; --sp-12:12px; --sp-16:16px; --sp-20:20px; --sp-24:24px;
    /* ── Radius ── */
    --r-sm:8px; --r-md:14px; --r-pill:999px;
    /* ── Spring easing ── */
    --ease-spring:cubic-bezier(0.34,1.56,0.64,1);
    --ease-smooth:cubic-bezier(0.22,0.61,0.36,1);
  }
  /* ── Night-aware theme (festival hours) ── */
  .theme-sunset{--ink:#1a120d;--paper:#f5e6d0;--paper-2:#e8d4b8;--line:rgba(26,18,13,0.14);--line-2:rgba(26,18,13,0.24);--muted:rgba(26,18,13,0.68)}
  .theme-night{--ink:#f0e6d8;--paper:#0d0a14;--paper-2:#1a1030;--line:rgba(240,230,216,0.1);--line-2:rgba(240,230,216,0.18);--muted:rgba(240,230,216,0.62);--dune:#3d2e5c}
  .theme-night html,.theme-night body{background:#0d0a14;color:#f0e6d8}
  .theme-dawn{--ink:#1a120d;--paper:#f0e0f0;--paper-2:#e0d0e8;--line:rgba(26,18,13,0.12);--line-2:rgba(26,18,13,0.2);--muted:rgba(26,18,13,0.62);--horizon:#9b5dba}
  button { transition: opacity 0.1s ease; }
  @keyframes totem-pulse{0%,100%{box-shadow:0 0 0 0 rgba(109,40,217,0.4);transform:scale(1)}50%{box-shadow:0 0 12px 4px rgba(109,40,217,0.25);transform:scale(1.06)}}
  @keyframes song-ripple {
    0% { box-shadow: 0 0 0 0 rgba(109,40,217,0.4); }
    70% { box-shadow: 0 0 0 8px rgba(109,40,217,0); }
    100% { box-shadow: 0 0 0 0 rgba(109,40,217,0); }
  }
  @keyframes song-fade-in {
    0% { opacity: 0; transform: translateY(4px) scale(0.95); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
  @keyframes savePop{0%{transform:scale(1)}35%{transform:scale(1.06)}100%{transform:scale(1)}}
  @keyframes checkIn{0%{opacity:0;transform:scale(0.3)}60%{opacity:1;transform:scale(1.15)}100%{opacity:1;transform:scale(1)}}
  @keyframes springIn{0%{opacity:0;transform:translateY(8px) scale(0.97)}60%{transform:translateY(-2px) scale(1.01)}100%{opacity:1;transform:translateY(0) scale(1)}}
  .skel{background:linear-gradient(90deg,var(--paper-2) 25%,rgba(26,18,13,0.08) 50%,var(--paper-2) 75%);background-size:200% 100%;animation:shimmer 1.5s ease-in-out infinite;border-radius:6px}
  .skel-dark{background:linear-gradient(90deg,rgba(247,237,224,0.04) 25%,rgba(247,237,224,0.08) 50%,rgba(247,237,224,0.04) 75%);background-size:200% 100%;animation:shimmer 1.5s ease-in-out infinite;border-radius:6px}
  /* Keyboard-only focus ring (WCAG 2.4.7) — :focus-visible so it never shows on mouse/touch tap. */
  :focus-visible{outline:2px solid var(--ember);outline-offset:2px;border-radius:3px}
  @media(prefers-reduced-motion:reduce){*{animation-duration:0.01ms !important;animation-iteration-count:1 !important;transition-duration:0.01ms !important}}
  @keyframes vfx-rise{0%{transform:translateY(0);opacity:0}8%{opacity:1}85%{opacity:.8}100%{transform:translateY(-140px) translateX(12px);opacity:0}}
  @keyframes vfx-fall{0%{transform:translateY(-10px);opacity:0}5%{opacity:.9}90%{opacity:.6}100%{transform:translateY(320px);opacity:0}}
  @keyframes vfx-drift{0%{transform:translate(0,0) scale(1);opacity:0}10%{opacity:.5}50%{opacity:.35}90%{opacity:.15}100%{transform:translate(30px,-80px) scale(1.8);opacity:0}}
  @keyframes vfx-pulse{0%,100%{opacity:.2}50%{opacity:.5}}
  @keyframes vfx-strobe{0%,85%,100%{opacity:0}90%{opacity:.6}}
  @keyframes vfx-beam-sweep{0%{transform:rotate(-25deg) scaleX(0.7)}50%{transform:rotate(25deg) scaleX(1.1)}100%{transform:rotate(-25deg) scaleX(0.7)}}
  @keyframes vfx-wash{0%,100%{opacity:.12;transform:scale(1)}50%{opacity:.28;transform:scale(1.15)}}
  @keyframes vfx-scan{0%{left:10%}50%{left:80%}100%{left:10%}}
  @keyframes vfx-flicker{0%,18%,22%,68%,72%,100%{opacity:.15}20%,70%{opacity:.45}}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" integrity="sha384-GFr3yTh5lJznCbZfpTtXnwboFsxqtTQoeTZCRHhE0579KrRmlCzen5AA8ohaB5ug" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root" class="stage"></div>

  <script>
    // Nuke escape hatch — visit /?nuke=1 to unregister all service workers,
    // wipe every cache, and clear stored version. Hoisted ABOVE the babel
    // script tags so it still runs even if a wedged jsx file crashes the
    // app boot — that's exactly when users need the escape hatch most.
    try {
      if (location.search.includes('nuke=1')) {
        Promise.all([
          'serviceWorker' in navigator
            ? navigator.serviceWorker.getRegistrations().then(rs => Promise.all(rs.map(r => r.unregister())))
            : Promise.resolve(),
          'caches' in window
            ? caches.keys().then(ks => Promise.all(ks.map(k => caches.delete(k))))
            : Promise.resolve(),
        ]).finally(() => {
          try { localStorage.removeItem('app_version'); } catch {}
          // Redirect with a timestamp cache-buster so Safari's HTTP cache
          // (GH Pages serves index.html with max-age=600) can't pin us
          // to the stale page after the SW + caches API are wiped.
          location.replace(location.pathname + '?cb=' + Date.now());
        });
        // Stop further script execution this load — the redirect handles
        // the next page view with a clean URL + fresh fetches.
        throw new Error('nuke');
      }
    } catch {}
  </script>

  <script>
    // In-app debug console — visit /?debug=1 (or chain with ?nuke=1&debug=1)
    // to see a floating panel of console.log/error/warn output. Captures
    // every message from boot onward into a ring buffer. For Jake to
    // diagnose map rendering without Safari Web Inspector.
    (function () {
      try {
        if (!location.search.includes('debug=1')) return;
        const buf = [];
        const MAX = 200;
        const orig = { log: console.log, warn: console.warn, error: console.error };
        const fmt = (args) => Array.prototype.map.call(args, (a) => {
          if (a instanceof Error) return a.message + '\n' + (a.stack || '');
          if (typeof a === 'object') { try { return JSON.stringify(a, null, 2); } catch { return String(a); } }
          return String(a);
        }).join(' ');
        ['log', 'warn', 'error'].forEach((k) => {
          console[k] = function () {
            buf.push({ k, m: fmt(arguments), t: Date.now() });
            while (buf.length > MAX) buf.shift();
            paint();
            return orig[k].apply(console, arguments);
          };
        });
        window.addEventListener('error', (e) => {
          buf.push({ k: 'error', m: '[window.error] ' + (e.message || '?') + ' @ ' + (e.filename || '?') + ':' + (e.lineno || '?'), t: Date.now() });
          paint();
        });
        window.addEventListener('unhandledrejection', (e) => {
          buf.push({ k: 'error', m: '[unhandled] ' + (e.reason && e.reason.message ? e.reason.message : String(e.reason)), t: Date.now() });
          paint();
        });
        const panel = document.createElement('div');
        // Pinned to TOP of viewport, below the iOS status strip — was at
        // bottom but covered the tab bar so users couldn't tap MAP/ME/etc.
        panel.style.cssText =
          'position:fixed;left:8px;right:8px;top:60px;max-height:30vh;z-index:99999;' +
          'background:rgba(6,4,18,0.94);color:#f7ede0;' +
          'border:1px solid rgba(247,237,224,0.35);border-radius:10px;' +
          'font-family:ui-monospace,Menlo,monospace;font-size:10.5px;line-height:1.35;' +
          'padding:6px 8px;overflow:auto;backdrop-filter:blur(6px);';
        const close = document.createElement('button');
        close.textContent = 'CLOSE';
        close.style.cssText =
          'position:absolute;top:4px;right:6px;background:#e85d2e;color:#fff;border:none;' +
          'padding:3px 7px;border-radius:4px;font:600 9px/1 ui-monospace,monospace;letter-spacing:1px;cursor:pointer;';
        close.onclick = () => panel.remove();
        let attached = false;
        function paint() {
          if (!attached && document.body) {
            document.body.appendChild(panel);
            panel.appendChild(close);
            attached = true;
          }
          if (!attached) return;
          const colors = { log: '#f7ede0', warn: '#fbbf24', error: '#f87171' };
          panel.querySelectorAll('.l').forEach((n) => n.remove());
          buf.slice(-60).forEach((entry) => {
            const div = document.createElement('div');
            div.className = 'l';
            div.style.cssText = 'color:' + colors[entry.k] + ';padding:2px 0;white-space:pre-wrap;border-bottom:1px solid rgba(247,237,224,0.08);';
            const ts = new Date(entry.t).toISOString().slice(11, 19);
            div.textContent = '[' + ts + ' ' + entry.k.toUpperCase() + '] ' + entry.m;
            panel.appendChild(div);
          });
          panel.scrollTop = panel.scrollHeight;
        }
        // Paint once body is ready, in case console fires before <body>.
        if (document.body) paint();
        else document.addEventListener('DOMContentLoaded', paint);
        console.log('[plursky-debug] panel armed. v=' + (document.querySelector('script[src*=app]')?.src?.match(/v=v\d+/)?.[0] || '?'));
      } catch (e) { /* never let debug break the app */ }
    })();
  </script>

  <script>
    // Native PHPicker (via @capacitor/camera) preserves EXIF DateTimeOriginal
    // that the WebKit <input type="file"> path strips on edge-case photos.
    // Flip this on inside the Capacitor shell so iOS users get reliable
    // auto-tagging; plursky.com web users keep the standard picker (no
    // native plugin available there). Added in v1.4. See spotify.jsx
    // pickViaNative() for the consumer.
    if (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) {
      window.__USE_NATIVE_PICKER__ = true;
    }
  </script>
  <script type="text/babel" src="ios-frame.jsx?v=v228"></script>
  <script type="text/babel" src="data.jsx?v=v228"></script>
  <script type="text/babel" src="supabase.jsx?v=v228"></script>
  <script type="text/babel" src="chrome.jsx?v=v228"></script>
  <script type="text/babel" src="home.jsx?v=v228"></script>
  <script type="text/babel" src="map.jsx?v=v228"></script>
  <script type="text/babel" src="lineup.jsx?v=v228"></script>
  <script type="text/babel" src="artist.jsx?v=v228"></script>
  <script type="text/babel" src="photo-tag.jsx?v=v228"></script>
  <script type="text/babel" src="spotify-api.jsx?v=v228"></script>
  <script type="text/babel" src="recap-engine.jsx?v=v228"></script>
  <script type="text/babel" src="spotify.jsx?v=v228"></script>
  <script type="text/babel" src="app.jsx?v=v228"></script>

  <script>

    // Build version stamp â€” bumped on every deploy that changes app behaviour.
    // If the running tab's stored version doesn't match, force a full reload
    // (bypassing browser HTTP cache that GH-Pages serves with max-age=600).
    const APP_VERSION = 'v228';
    try {
      const stored = localStorage.getItem('app_version');
      if (stored && stored !== APP_VERSION) {
        localStorage.setItem('app_version', APP_VERSION);
        if ('caches' in window) {
          // Wipe app caches on version bump, but keep the LVMS map tile
          // cache so users don't re-download the festival basemap when
          // we ship a new app version mid-event.
          caches.keys().then(ks => Promise.all(
            ks.filter(k => !k.startsWith('plursky-tiles-')).map(k => caches.delete(k))
          )).then(() => location.reload());
        } else { location.reload(); }
      } else if (!stored) {
        localStorage.setItem('app_version', APP_VERSION);
      }
    } catch {}

    if ('serviceWorker' in navigator) {
      caches.keys().then(keys =>
        Promise.all(
          keys.filter(k => k !== 'plursky-v228' && !k.startsWith('plursky-tiles-'))
              .map(k => caches.delete(k))
        )
      ).then(() =>
        navigator.serviceWorker.register('./sw.js?v=v228', { updateViaCache: 'none' })
          .then(reg => { try { reg.update(); } catch {} })
      );

      // (Removed the controllerchange auto-reload. It caused a second
      // visible reload after the version-stamp cache wipe: page load →
      // wipe + reload → SW reinstalls → controllerchange → ANOTHER
      // reload. Jake's "loads for a sec then goes blank then reloads"
      // was that double reload. SW network-first strategy in sw.js
      // already delivers fresh JS on the next navigation; we don't
      // need to force-reload on SW takeover.)
    }
  </script>
</body>
